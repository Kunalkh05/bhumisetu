# GitHub Actions CI/CD Workflow — BHUMISETU

name: CI Pipeline

on:
  push:
    branches: [main, ironman]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  POSTGRES_DB: bhumisetu_test
  POSTGRES_USER: bhumisetu
  POSTGRES_PASSWORD: test_password

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        working-directory: bhumi-setu/apps/api
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run ruff linter
        working-directory: bhumi-setu/apps/api
        run: ruff check app/ tests/

      - name: Run ruff formatter check
        working-directory: bhumi-setu/apps/api
        run: ruff format --check app/ tests/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node dependencies
        working-directory: bhumi-setu/apps/web
        run: npm ci

      - name: TypeScript type check
        working-directory: bhumi-setu/apps/web
        run: npx tsc --noEmit

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgis/postgis:14-3.4
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: bhumi-setu/apps/api
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        working-directory: bhumi-setu/apps/api
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: alembic upgrade head

      - name: Run tests with coverage
        working-directory: bhumi-setu/apps/api
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379
          TESTING: "true"
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: bhumi-setu/apps/api/coverage.xml

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: bhumi-setu/apps/web
        run: npm ci

      - name: Build
        working-directory: bhumi-setu/apps/web
        run: npm run build

  compliance:
    name: Compliance Tests
    runs-on: ubuntu-latest
    needs: [test-api]
    services:
      postgres:
        image: postgis/postgis:14-3.4
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: bhumi-setu/apps/api
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run compliance tests
        working-directory: bhumi-setu/apps/api
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          TESTING: "true"
        run: |
          pytest tests/test_route_table.py \
                 tests/test_version_uniformity.py \
                 tests/test_rbac_matrix.py \
                 tests/test_field_coverage.py \
                 tests/test_signin_indistinguishability.py \
                 -v --tb=short

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan Python dependencies
        working-directory: bhumi-setu/apps/api
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Scan Node dependencies
        working-directory: bhumi-setu/apps/web
        run: npm audit --audit-level=high
