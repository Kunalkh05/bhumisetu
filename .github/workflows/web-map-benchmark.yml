name: Web Map Benchmark

on:
  pull_request:
    paths:
      - "bhumi-setu/apps/web/**"
      - ".github/workflows/web-map-benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "bhumi-setu/apps/web/**"
      - ".github/workflows/web-map-benchmark.yml"

jobs:
  map-render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bhumi-setu/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bhumi-setu/apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run perf:map
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-render-benchmark
          path: bhumi-setu/apps/web/.benchmarks/map-render.json
