{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h2>Confirm download</h2>
  <p>{{ document.original_filename }}</p>
  <p class="muted">{{ document.document_type }} · {{ document.byte_size }} bytes</p>
  <a href="/c/documents/{{ document.id }}">Open document</a>
</section>
{% endblock %}
