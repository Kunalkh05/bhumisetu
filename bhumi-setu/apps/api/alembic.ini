# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: env.py reads DATABASE_URL through
# app.settings, so there is exactly one place a connection string comes from
# (settings.py, "A missing value that changes behaviour refuses rather than
# defaults"). A url here would be a second source that silently wins.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Revision ids are sequential and readable (0001, 0002) rather than random
# hashes. The migration order is the review order, and a reviewer should be able
# to see it in the filename.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
